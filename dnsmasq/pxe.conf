# ---------------------------------------------------------------------------
# proxy-DHCP + TFTP for iPXE chainloading.
#
# The router stays the DHCP server; dnsmasq only adds the boot information.
# Nothing here answers DNS queries, AdGuard Home keeps that job (port=0).
#
# Adjust the two addresses below to your LAN, then check the boot with:
#   docker compose --profile netboot logs -f dnsmasq-pxe
# ---------------------------------------------------------------------------

port=0
log-dhcp

# Subnet of the LAN, "proxy" means: do not hand out addresses.
dhcp-range=192.168.1.0,proxy

# iPXE identifies itself with DHCP option 175. First pass: firmware, no tag.
# Second pass: our own iPXE, tagged, and it gets the HTTP script.
dhcp-match=set:ipxe,175

# Pass 1, UEFI x86-64 firmware: load iPXE over TFTP.
# dnsmasq appends the architecture suffix to the basename, so the file in
# ./tftp must be ipxe.efi. If the log shows a "file not found", use the
# explicit variant below instead.
pxe-service=tag:!ipxe,x86-64_EFI,"Netboot: iPXE",ipxe
#pxe-service=tag:!ipxe,x86-64_EFI,"Netboot: iPXE",ipxe.efi

# Legacy BIOS clients, harmless to keep around.
pxe-service=tag:!ipxe,x86PC,"Netboot: iPXE (BIOS)",undionly.kpxe

# Pass 2, our iPXE asks again: send it to the waker, which decides ai vs work.
dhcp-boot=tag:ipxe,http://192.168.1.10:8080/boot.ipxe

enable-tftp
tftp-root=/tftp
tftp-no-fail
