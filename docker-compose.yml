services:
  ai-waker:
    build:
      # Remote-Kontext: BuildKit klont das Repo und nimmt das Repo-Root als Build-Kontext.
      context: https://github.com/sleien/local-ai-waker.git#main
    image: local-ai-waker:latest
    container_name: ai-waker
    restart: unless-stopped
    env_file: .env
    environment:
      # Magic packets go out through wol-relay, see there.
      WAKER_WOL_RELAY: /run/waker/wol.sock
    volumes:
      # Model list cache, so polling clients do not wake the workstation.
      - ./data:/data
      - wol-relay:/run/waker
    depends_on:
      - wol-relay
    networks:
      - proxy
    # No published ports. Everything from outside comes through Traefik,
    # everything from inside (Homepage, other containers) reaches the service
    # by name: http://ai-waker:8080 and http://ai-waker:8081.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"

      # --- API: ai.$DOMAIN -> Ollama on the workstation --------------------
      # Guarded by WAKER_API_KEY inside the app, no Authentik: API clients
      # cannot do an interactive login flow. Limited to the API paths.
      - "traefik.http.routers.ai-waker.rule=Host(`ai.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/v1`))"
      - "traefik.http.routers.ai-waker.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.ai-waker.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.routers.ai-waker.service=ai-waker"
      - "traefik.http.services.ai-waker.loadbalancer.server.port=8080"

      # --- Admin UI: waker.$DOMAIN, behind Authentik -----------------------
      - "traefik.http.routers.ai-waker-admin.rule=Host(`waker.${DOMAIN}`)"
      - "traefik.http.routers.ai-waker-admin.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.ai-waker-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.routers.ai-waker-admin.service=ai-waker-admin"
      - "traefik.http.routers.ai-waker-admin.middlewares=${AUTHENTIK_MIDDLEWARE:-authentik@docker},ai-waker-token"
      - "traefik.http.services.ai-waker-admin.loadbalancer.server.port=8081"
      # After Authentik, Traefik adds WAKER_ADMIN_TOKEN to every request, so the
      # optional token only locks out callers that bypass Traefik. Left empty,
      # the header is stripped instead and the waker does not check it.
      - "traefik.http.middlewares.ai-waker-token.headers.customrequestheaders.X-Waker-Token=${WAKER_ADMIN_TOKEN:-}"

  wol-relay:
    # Same image, different job. A broadcast from a Docker bridge network never
    # reaches the LAN (Linux does not forward directed broadcasts), so this part
    # runs in the host's network namespace and only sends the magic packets.
    # It opens no port; ai-waker reaches it over the socket on the shared volume.
    build:
      # Remote-Kontext: BuildKit klont das Repo und nimmt das Repo-Root als Build-Kontext.
      context: https://github.com/sleien/local-ai-waker.git#main
    image: local-ai-waker:latest
    container_name: ai-waker-wol-relay
    restart: unless-stopped
    env_file: .env
    environment:
      WAKER_WOL_RELAY: /run/waker/wol.sock
      # Safety net for the host network: should this container ever run the API
      # server instead of the relay (a stale image without the wol-relay command),
      # it binds to loopback instead of exposing ports on the LAN.
      WAKER_LISTEN: 127.0.0.1:18080
      WAKER_ADMIN_LISTEN: 127.0.0.1:18081
    command: ["wol-relay"]
    network_mode: host
    volumes:
      - wol-relay:/run/waker
    healthcheck:
      test: ["CMD", "test", "-S", "/run/waker/wol.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

volumes:
  wol-relay:
