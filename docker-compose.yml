services:
  ai-waker:
    build:
      # Remote-Kontext: BuildKit klont das Repo und nimmt das Repo-Root als Build-Kontext.
      context: https://github.com/sleien/local-ai-waker.git#main
    image: local-ai-waker:latest
    container_name: ai-waker
    restart: unless-stopped
    env_file: .env
    volumes:
      # Model list cache, so polling clients do not wake the workstation.
      - ./data:/data
    networks:
      - proxy
    # No published ports. Everything from outside comes through Traefik,
    # everything from inside (Homepage, other containers) reaches the service
    # by name: http://ai-waker:8080 and http://ai-waker:8081.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"

      # --- API: ai.$DOMAIN -> Ollama on the workstation --------------------
      # Guarded by WAKER_API_KEY inside the app, no Authentik: API clients
      # cannot do an interactive login flow. Limited to the API paths.
      - "traefik.http.routers.ai-waker.rule=Host(`ai.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/v1`))"
      - "traefik.http.routers.ai-waker.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.ai-waker.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.routers.ai-waker.service=ai-waker"
      - "traefik.http.services.ai-waker.loadbalancer.server.port=8080"

      # --- Admin UI: waker.$DOMAIN, behind Authentik -----------------------
      - "traefik.http.routers.ai-waker-admin.rule=Host(`waker.${DOMAIN}`)"
      - "traefik.http.routers.ai-waker-admin.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.ai-waker-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.routers.ai-waker-admin.service=ai-waker-admin"
      - "traefik.http.routers.ai-waker-admin.middlewares=${AUTHENTIK_MIDDLEWARE:-authentik@file}"
      - "traefik.http.services.ai-waker-admin.loadbalancer.server.port=8081"

      # If WAKER_ADMIN_TOKEN is set, let Traefik inject it so the browser does
      # not have to. Append ",waker-token" to the middlewares line above.
      # - "traefik.http.middlewares.waker-token.headers.customrequestheaders.X-Waker-Token=${WAKER_ADMIN_TOKEN}"

networks:
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
